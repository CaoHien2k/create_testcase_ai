{% extends 'base.html' %}

{% block styles %}
<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
    }
    body {
        display: flex;
        height: 100vh;
    }
    .sidebar {
        width: 200px;
        background-color: #333;
        color: white;
        padding: 20px;
    }
    .sidebar h2 {
        margin-bottom: 20px;
    }
    .sidebar ul {
        list-style-type: none;
    }
    .sidebar ul li {
        margin-bottom: 10px;
    }
    .sidebar ul li a {
        color: white;
        text-decoration: none;
    }
    .content-container {
        flex: 1;
        display: flex;
        flex-direction: column;
    }
    .top-bar {
        display: flex;
        justify-content: flex-end;
        padding: 10px;
        background-color: #555;
        color: white;
    }
    .dropdown {
        position: relative;
        display: inline-block;
    }
    .dropdown-content {
        display: none;
        position: absolute;
        right: 0;
        background-color: #f9f9f9;
        box-shadow: 0px 8px 16px 0px rgba(0, 0, 0, 0.2);
        z-index: 1;
        width: auto;  
        min-width: 120px; 
    }
    .dropdown-content a {
        color: black;
        padding: 12px 16px;
        text-decoration: none;
        display: block;
    }
    .dropdown-content a:hover {
        background-color: #ddd;
    }
    .dropdown:hover .dropdown-content {
        display: block;
    }
    .content {
        flex: 1;
        padding: 20px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
    }
    .output-form {
        flex: 1;
        padding: 10px;
        background-color: #f1f1f1;
        margin-bottom: 20px;
        overflow-y: auto;
    }
    .input-form {
        display: flex;
        gap: 10px;
    }
    
    .input-form input#textField {
        width: 200px; 
        padding: 8px;
        height: 30px; 
    }
    .input-form textarea#textInput {
        flex: 1; 
        height: 150px; 
        max-height: 200px; 
        padding: 8px;
        overflow-y: auto; 
        resize: vertical; 
    }
    .input-form button {
        padding: 8px 16px;
        cursor: pointer;
    }
</style>
{% endblock %}

{% block content %}

<div class="sidebar">
    <h2>Nhật Ký</h2>
    <ul>
        <li><a href="#">Nhật ký 1</a></li>
        <li><a href="#">Nhật ký 2</a></li>
        <li><a href="#">Nhật ký 3</a></li>
    </ul>
</div>

<div class="content-container">
    <div class="top-bar">
        <div class="dropdown">
            <span>Cài đặt</span>
            <div class="dropdown-content">
                <a href="#">Cài đặt 1</a>
                <a href="#">Cài đặt có nội dung dài hơn để kiểm tra</a>
                <a href="#">Cài đặt 3</a>
            </div>
        </div>
    </div>

    <div class="content">
        <div class="output-form" id="output">
            <p>Output sẽ được hiển thị tại đây...</p>
        </div>

        <div class="input-form">
            <input type="text" id="textField" placeholder="Nhập văn bản...">
            <textarea id="textInput" placeholder="Nhập nội dung..."></textarea>
            <button onclick="submitForm()">Gửi</button>
        </div>
    </div>
</div>

<script>
    function submitForm() {
        const textField = document.getElementById("textField").value;
        const textInput = document.getElementById("textInput").value;
        const output = document.getElementById("output");

        if (textField && textInput) {
            const newEntry = document.createElement("p");
            newEntry.textContent = `Văn bản: ${textField}, Nội dung: ${textInput}`;
            output.appendChild(newEntry);

            document.getElementById("textField").value = '';
            document.getElementById("textInput").value = '';
        } else {
            alert("Vui lòng nhập đầy đủ thông tin!");
        }
    }
</script>

{% endblock %}
